<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intelligent Sales Analytics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Intelligent Sales Analytics</h1>
            <p>Customer Churn Prediction Dashboard</p>
        </header>

        <section class="card">

            <h2>Customer Information</h2>

            <div class="form-grid">

                <div class="input-group">
                    <label>Total Spent</label>
                    <input type="number" id="TotalSpent" placeholder="e.g. 500">
                </div>

                <div class="input-group">
                    <label>Total Orders</label>
                    <input type="number" id="TotalOrders" placeholder="e.g. 3">
                </div>

                <div class="input-group">
                    <label>Total Quantity</label>
                    <input type="number" id="TotalQuantity" placeholder="e.g. 20">
                </div>

                <div class="input-group">
                    <label>Average Order Value</label>
                    <input type="number" id="AverageOrderValue" placeholder="e.g. 166.67">
                </div>

                <div class="input-group">
                    <label>Customer Lifetime (days)</label>
                    <input type="number" id="CustomerLifetime" placeholder="e.g. 100">
                </div>

                <div class="input-group">
                    <label>Recency (days)</label>
                    <input type="number" id="Recency" placeholder="e.g. 80">
                </div>

                <div class="input-group">
                    <label>Frequency</label>
                    <input type="number" id="Frequency" placeholder="e.g. 3">
                </div>

            </div>

            <button onclick="predictChurn()">
                Predict Churn
            </button>

        </section>

        <section class="result-card">

            <h2>Prediction Result</h2>

            <div class="result-grid">

                <div>
                    <span>Churn Prediction</span>
                    <strong id="prediction">-</strong>
                </div>

                <div>
                    <span>Churn Probability</span>
                    <strong id="probability">-</strong>
                </div>

                <div>
                    <span>Risk Level</span>
                    <strong id="risk">-</strong>
                </div>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
